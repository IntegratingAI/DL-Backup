<script>
const APP = {"key": "windows11", "os": "Windows 11 26H2 (Pro / Enterprise)", "accent": "#1F4FD8", "footer": "Training tool for Windows 11 virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Microsoft.", "legend": "PS> runs in an elevated PowerShell and CMD> in an elevated Command Prompt. Type what follows the prefix, and replace each <name> with a real value. GUI: lines walk through a window, and indented lines show values to set or read.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. These are the fixes that are safe on almost any machine and close the most common gaps: users, admins, passwords, firewall, updates, Defender, and unapproved software. Learn it first: Defense Ladder s2, \"Windows 11 hardening.\"", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden"], "why": "Most outages during hardening come from acting against the documented requirements: removing a user, role, or service the business needs is an availability failure. Evidence first: answer the investigation questions before any change (Defense Ladder f1).", "note": "Unfamiliar software is distinct from unauthorized software: trace it, and ask the owner before removing an agent (Defense Ladder s1).", "task": "", "t": "", "area": "inv"}, {"id": "B-01", "title": "List local users", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordRequired,LastLogon", "CMD> net user", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion' | Select-Object EditionID,CurrentBuild", "GUI: Win+R, lusrmgr.msc (not available on Home)"], "why": "Unauthorized accounts are backdoors. Compare the list to the authorized users in the scenario brief.", "note": "PasswordRequired False only allows a blank password: accounts made by Windows Setup often show False with a password in place, so set a password and require it on each enabled account the brief keeps (net user <name> * /passwordreq:yes). Control Panel, User Accounts, Manage another account labels each account that has a password Password protected. EditionID Core means Home (ProductName can still say Windows 10), and Home leaves out lusrmgr.msc and secpol.msc: use Settings, Accounts, Other users, or netplwiz.", "task": "list local users (cmd)", "t": "net user", "ta": ["get-localuser"], "area": "acct"}, {"id": "B-02", "title": "Remove an unauthorized user", "cmds": ["PS> Get-ScheduledTask | Where-Object { $_.Principal.UserId -like '*baduser' } | Select-Object TaskPath,TaskName", "PS> Get-CimInstance Win32_Service | Where-Object StartName -like '*baduser' | Select-Object Name,StartName,PathName", "PS> Remove-LocalUser -Name \"baduser\"", "CMD> net user baduser /delete", "CMD> net user baduser /active:no"], "why": "Deleting removes the login path and the profile's persistence hooks.", "note": "Remove only accounts missing from the brief. When the brief is unclear, disable first (/active:no), ask the system owner, and decide once. Answer every investigation question that names the account first, and handle each task or service the first two lines show running as it. Deleting the account keeps C:\\Users\\baduser: search it for evidence and prohibited files before you remove the folder.", "task": "delete the local user baduser (cmd)", "t": "net user baduser /delete", "ta": ["remove-localuser -name baduser", "remove-localuser baduser"], "area": "acct"}, {"id": "B-03", "title": "Audit the Administrators group", "cmds": ["PS> Get-LocalGroupMember -Group Administrators", "CMD> net localgroup Administrators", "CMD> net localgroup \"Backup Operators\"", "CMD> net localgroup Administrators baduser /delete", "CMD> net localgroup Administrators alice /add"], "why": "An admin can switch off every other control. Least privilege is the single highest-value idea in system hardening.", "note": "Demote users the brief calls standard; promote only the listed admins. Backup Operators, Remote Desktop Users, and Remote Management Users also grant power where they exist, so compare each with the brief (Get-LocalGroup lists every group). A demoted user who is signed in keeps admin rights until signing out: Task Manager, Users, Sign out.", "task": "show who is in the Administrators group (cmd)", "t": "net localgroup Administrators", "ta": ["get-localgroupmember administrators", "get-localgroupmember -group administrators"], "area": "acct"}, {"id": "B-04", "title": "Disable Guest and the built-in Administrator", "cmds": ["PS> Get-LocalUser | Where-Object { $_.SID -like '*-50[01]' } | Select-Object Name,Enabled,SID", "CMD> whoami /user", "CMD> net user Guest /active:no", "CMD> net user Administrator /active:no"], "why": "Well-known accounts are well-known targets; attackers brute-force them by name. Guest allows anonymous-style access. The built-in Administrator's SID ends in -500 and Guest's in -501, so the first line finds both even after a rename.", "note": "If the brief says you log in as Administrator, keep it enabled and give it a strong password instead. whoami /user shows your own SID: one ending in -500 means you are signed in as the built-in Administrator. Rename both accounts as a last step, and only when the brief or policy asks (Rename-LocalUser -Name Administrator -NewName <new name>); the SID stays, so disabling and a strong password carry the protection.", "task": "disable the Guest account", "t": "net user Guest /active:no", "area": "acct"}, {"id": "B-05", "title": "Strong passwords for every user", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordLastSet,PasswordExpires", "CMD> net user alice *", "PS> Get-LocalUser | Where-Object { $_.Enabled -and $_.Name -ne $env:USERNAME } | Set-LocalUser -PasswordNeverExpires $false", "CMD> net user alice /logonpasswordchg:yes"], "why": "Weak, shared, or blank passwords are the number one way in. Password never expires defeats the aging policy, so clear it first and then ask for a change at next logon. The * makes net user prompt for the password, which keeps it out of the screen and the command history.", "note": "Set the password policy first (B-06, B-07) so each new password must meet it. Give the account a fresh password before clearing Password never expires: clearing it on an old password expires it at once, and a service or task that signs in with it needs the new one too. Change your own sign-in password only when the brief says so. An administrator reset locks the user out of files they encrypted and of saved passwords. Record every changed password somewhere safe (on paper, in a lab).", "task": "force alice to change the account's password at next logon", "t": "net user alice /logonpasswordchg:yes", "area": "acct"}, {"id": "B-06", "title": "Password policy", "cmds": ["CMD> net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24", "CMD> net accounts"], "gui": "secpol.msc, Account Policies, Password Policy. Turn on 'Password must meet complexity requirements' and keep 'Store passwords using reversible encryption' off.", "why": "Length beats everything. Minimum age plus history stops the trick of cycling through 24 new passwords to reuse an old one. Reversible encryption is plaintext in disguise. Turning reversible encryption off protects new passwords only, so reset the passwords set while it was on.", "note": "The scenario brief sets the numbers; these commands show one sample brief. The CIS Benchmark asks for 14 or more characters, a history of 24, a maximum age of 365 days or fewer (and above 0), and a minimum age of 1 day. net accounts stops at 14 characters: a brief that asks for 15 or more needs Password Policy, Relax minimum password length limits = Enabled, then the length in secpol.msc or secedit. Complexity sits outside net accounts: use secpol.msc, or on any edition, Home included, a secedit template with PasswordComplexity = 1 (Hunter A-01).", "task": "set min password length 12, max age 60, min age 1, history 24 (cmd)", "t": "net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24", "area": "acct"}, {"id": "B-07", "title": "Account lockout policy", "cmds": ["CMD> net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30"], "why": "Turns an online brute force from thousands of guesses a minute into five per half hour.", "note": "The scenario brief sets the numbers; these commands show one sample brief. The CIS Benchmark asks for a threshold of 5 or fewer (and above 0), and a lockout duration and reset window of 15 minutes or more. A threshold of 0 means never lock, which is a finding. Lockout covers the built-in Administrator only when Allow Administrator account lockout is Enabled (AllowAdministratorLockout = 1 in a secedit template, Hunter A-01); it then locks that account for network sign-ins such as Remote Desktop, and console sign-in stays available.", "task": "lock accounts after 5 bad tries for 30 minutes (cmd)", "t": "net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30", "area": "acct"}, {"id": "B-08", "title": "Firewall on for all profiles", "cmds": ["PS> Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True", "PS> Get-NetFirewallProfile -PolicyStore ActiveStore | Select-Object Name,Enabled,DefaultInboundAction", "CMD> netsh advfirewall set allprofiles state on"], "gui": "Settings, Privacy and security, Windows Security, Firewall and network protection.", "why": "Default-deny inbound covers the service you have not found yet. Misconfigured machines often have exactly one profile off, usually Public.", "note": "DefaultInboundAction should be Block. ActiveStore shows the values in force, Group Policy included; the plain view shows NotConfigured for a value left at its Windows default (Block for inbound). Allow-rule review is a Watchman item.", "task": "turn the firewall on for every profile (cmd)", "t": "netsh advfirewall set allprofiles state on", "ta": ["set-netfirewallprofile -profile domain,public,private -enabled true", "set-netfirewallprofile -all -enabled true"], "area": "config"}, {"id": "B-09", "title": "Windows Update: run it and automate it", "cmds": ["GUI: Settings, Windows Update: Resume updates if paused, then Check for updates; Advanced options: receive updates for other Microsoft products", "PS> Get-Service wuauserv,BITS,UsoSvc | Select-Object Name,Status,StartType", "PS> Set-Service -Name wuauserv -StartupType Automatic; Start-Service wuauserv", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /s", "PS> Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5", "PS> winget upgrade", "PS> winget upgrade --all --silent --accept-package-agreements --accept-source-agreements"], "why": "Patching closes the holes scanners find. Two checks: patched now (Get-HotFix shows the newest install date), and automatic updates left on; I-18 covers the policy values that stop them while the service runs. Windows Update patches Windows and Microsoft apps; browsers and other apps update through winget or their own updater.", "note": "Start it first and let it run in the background; after each restart, check again until Windows Update reports this device is up to date. Manual is the shipped start type for wuauserv (it starts on demand), and Disabled is the finding. Remove prohibited apps (B-11) before winget upgrade --all, so it updates only what stays. Save your work before any reboot.", "area": "patch"}, {"id": "B-10", "title": "Defender: real-time on, definitions current, scan", "cmds": ["PS> Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Set-MpPreference -DisableRealtimeMonitoring $false", "PS> Update-MpSignature", "PS> Start-MpScan -ScanType QuickScan", "PS> Start-MpScan -ScanType CustomScan -ScanPath C:\\Users", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,ProcessName,Resources"], "gui": "Windows Security, Virus and threat protection, Manage settings.", "why": "Real-time protection is the baseline malware control. Neglected or compromised machines have it off, or carry exclusions that hide malware.", "note": "If Tamper Protection blocks the cmdlet, flip it in the GUI. Answer the investigation questions before any scan, because a scan can quarantine the very file a question asks about. Resources names each detected file: record it, then remove the program that dropped it when the brief leaves that program out.", "task": "update Defender signatures", "t": "Update-MpSignature", "area": "malware"}, {"id": "B-11", "title": "Remove unapproved software", "cmds": ["PS> Get-ItemProperty HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, Registry::HKEY_USERS\\*\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* -ErrorAction SilentlyContinue | Select-Object DisplayName,DisplayVersion,Publisher,UninstallString | Sort-Object DisplayName", "GUI: Settings, Apps, Installed apps (or appwiz.cpl)", "PS> winget list", "PS> winget uninstall --id WiresharkFoundation.Wireshark --exact", "PS> Get-AppxPackage -AllUsers | Select-Object Name | Sort-Object Name", "PS> Get-AppxPackage -AllUsers *xbox* | Remove-AppxPackage -AllUsers"], "why": "Hacking tools, games, torrent clients, and remote-access tools are acceptable-use violations and attack surface.", "note": "Software the brief requires stays. The registry listing is instant; Win32_Product is slow and can trigger repairs. Store apps do not appear in the Uninstall registry key: list them with Get-AppxPackage. HKEY_USERS adds apps installed for one signed-in user only. Capture tools install Npcap as a program of its own: remove it too when the brief leaves out packet capture. After removing a remote-access tool, look for its leftover service (I-04) and firewall rule (I-12). Portable tools appear only in a file search (B-12, A-06).", "area": "software"}, {"id": "B-12", "title": "Find unapproved media and loose executables", "cmds": ["PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4,*.wav,*.avi,*.mkv,*.flac,*.mov,*.m4a,*.mpg,*.mpeg,*.ogg,*.flv,*.wma,*.aac -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName", "PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.exe,*.bat,*.cmd,*.ps1,*.vbs,*.hta,*.py,*.jar,*.zip,*.7z,*.rar -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\(Microsoft|Packages)\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName,LastWriteTime", "CMD> tar -tf \"C:\\Users\\<user>\\Downloads\\<archive>.zip\""], "why": "Many acceptable-use policies ban personal media on work machines, and scripts sitting in user folders are often the planted backdoor.", "note": "Confirm against the brief before deleting, and search C:\\ too, beyond C:\\Users. -Force shows hidden files; the filters skip app caches under AppData and the All Users and Default User links. Answer every investigation question that names a file first and record its hash (B-14); then delete it and log the path. tar -tf lists what a .zip holds before you delete it. Python and other runtimes stay when the brief needs them.", "area": "data"}, {"id": "B-13", "title": "Stop obviously unsafe services", "cmds": ["PS> Get-Service -Name ftpsvc,TermService,RemoteRegistry,SNMP -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType", "PS> Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -Value 1", "PS> Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue | Disable-NetFirewallRule", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\" /v fDenyTSConnections", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance' -Name fAllowToGetHelp -Value 0", "PS> Get-NetFirewallRule -Group '@FirewallAPI.dll,-33002' -ErrorAction SilentlyContinue | Disable-NetFirewallRule", "PS> Get-NetTCPConnection -State Listen -LocalPort 21,3389 -ErrorAction SilentlyContinue"], "why": "Telnet and FTP leak credentials in cleartext. Remote Registry lets a remote attacker edit the registry. RDP is a brute-force magnet. Remote Assistance starts out allowed on Windows 11 and lets an invited helper take over the desktop.", "note": "If the brief requires RDP, FTP, or SSH, harden it (I-11) rather than stop it. Turning Remote Desktop off takes the setting plus its firewall group. The @FirewallAPI names work in any display language. Home lacks the Remote Desktop group, so that line returns quietly there. fDenyTSConnections under the Terminal Services policy key is Group Policy and beats the Settings switch. A value of 0 there forces Remote Desktop back on, so a missing-value error is the good result. The last line returns empty once FTP and Remote Desktop stop listening.", "task": "stop Remote Registry and disable its startup", "t": "Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "gui": "Settings, System, Remote Desktop: Off unless the brief requires it. services.msc for the rest: set Startup type to Disabled.", "area": "config"}, {"id": "B-14", "title": "Hash a file for an investigation question", "cmds": ["PS> Get-FileHash -LiteralPath 'C:\\Users\\<user>\\Desktop\\<file>' -Algorithm SHA256 | Format-List", "CMD> certutil -hashfile \"C:\\Users\\<user>\\Desktop\\<file>\" SHA256", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,Resources"], "why": "An investigation answer is the exact hex string for the exact algorithm the question names. Hash the untouched file before any Defender scan, cleanup, or move, because a changed or quarantined file gives a different answer or vanishes.", "note": "Hash lengths: MD5 32 hex characters, SHA1 40, SHA256 64, and the value repeats on every run. -LiteralPath reads names with [ ] that -Path skips, and quotes keep paths with spaces whole. certutil defaults to SHA1, so name the algorithm. When opening the file reports a virus, Defender has already quarantined it: Get-MpThreatDetection and Windows Security, Protection history show the path and time to record.", "task": "print the SHA256 hash of C:\\Users\\Public\\notes.txt", "t": "Get-FileHash -Algorithm SHA256 C:\\Users\\Public\\notes.txt", "ta": ["get-filehash c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -path c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -literalpath c:\\users\\public\\notes.txt -algorithm sha256", "certutil -hashfile c:\\users\\public\\notes.txt sha256"], "area": "inv"}, {"id": "B-15", "title": "Create the users and groups the brief lists", "cmds": ["PS> New-LocalUser -Name 'kekoa' -Password (Read-Host -AsSecureString 'Password')", "CMD> net user kekoa * /add", "CMD> net localgroup Accounting /add", "CMD> net localgroup Accounting kekoa /add", "PS> Get-LocalGroupMember -Group Accounting"], "why": "A user or group the brief lists and the machine lacks leaves a person unable to sign in or reach the files the job needs. Creating exactly what the brief lists keeps the account list matching the source of truth.", "note": "Create only the accounts and groups the brief lists, then add the members it names, and read the result back. The * prompts for the password, so it stays out of the command history; net user /add places the account in Users. Security event 4720 records each new account.", "task": "create the local user kekoa and prompt for the password (cmd)", "t": "net user kekoa * /add", "area": "acct"}, {"id": "B-16", "title": "Find files that store passwords", "cmds": ["PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.txt,*.csv,*.ini,*.xml,*.log,*.ps1,*.bat -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-String -Pattern 'passw(or)?d|pwd|credential' -List | Select-Object Path,LineNumber,Line", "CMD> findstr /s /i /m /c:\"password\" C:\\Users\\*.txt C:\\Users\\*.csv C:\\Users\\*.ini", "PS> Get-ChildItem -Path C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt -Force -ErrorAction SilentlyContinue | Select-String -Pattern 'net user|ConvertTo-SecureString|passw' | Select-Object Path,Line", "PS> Get-ChildItem -Path C:\\Windows\\Panther\\Unattend.xml,C:\\Windows\\Panther\\Unattend\\Unattend.xml,C:\\Windows\\System32\\Sysprep\\unattend.xml -Force -ErrorAction SilentlyContinue | Select-String -Pattern '<Password>|AdministratorPassword' | Select-Object Path,LineNumber", "CMD> cmdkey /list"], "why": "A password saved in a note, a script, the PowerShell history, or a leftover Windows Setup answer file hands an account to anyone who reads it. Searching by content finds them under any file name.", "note": "Answer any investigation question that names the file first and record its hash (B-14); then remove or move the file where the brief says and log the path. Review each hit: license and app files match too. An answer file's hidden password is only encoded; treat it as plain text. cmdkey /list shows passwords Windows saved for the signed-in user, such as TERMSRV/<host> for a Remote Desktop sign-in; cmdkey /delete:<target> removes one the brief leaves out, and each user sees only their own list.", "task": "list the .txt files under C:\\Users that contain the word password (cmd)", "t": "findstr /s /i /m password C:\\Users\\*.txt", "ta": ["findstr /s /i /m /c:password c:\\users\\*.txt", "findstr /i /s /m password c:\\users\\*.txt", "findstr /s /m /i password c:\\users\\*.txt"], "area": "data"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Policy, services, shares, scheduled tasks, startup items, hosts file, listening ports, and logs. This is where the hidden stuff lives. Learn it first: Defense Ladder j2, \"Group Policy.\"", "items": [{"id": "I-01", "title": "Audit policy: turn the lights on", "cmds": ["CMD> wevtutil sl Security /ms:201326592", "CMD> auditpol /backup /file:C:\\Windows\\Temp\\audit-before.csv", "CMD> auditpol /set /category:* /success:enable /failure:enable", "CMD> auditpol /get /category:*"], "why": "Without auditing, Event Viewer has nothing to tell you or an investigator. Logon, account management, and policy change are the key ones.", "note": "Pick one route, auditpol here or Advanced Audit Policy Configuration in Group Policy, and leave secpol's basic Audit Policy node unset; Microsoft warns that mixing the two gives unexpected results, so trust auditpol /get. wevtutil raises the Security log to 192 MB first so the extra events keep older evidence; auditpol /restore /file:C:\\Windows\\Temp\\audit-before.csv undoes the change. Fine-grained subcategories, and trimming the noisiest ones, are A-08.", "task": "enable success and failure auditing for every category", "t": "auditpol /set /category:* /success:enable /failure:enable", "area": "audit"}, {"id": "I-02", "title": "Security Options in secpol.msc", "cmds": ["GUI: secpol.msc, Local Policies, Security Options", "  Accounts: Limit local account use of blank passwords to console logon only = Enabled", "  Devices: Prevent users from installing printer drivers = Enabled", "  Interactive logon: Don't display last signed-in = Enabled (older label: Do not display last user name)", "  Interactive logon: Do not require CTRL+ALT+DEL = Disabled", "  Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled", "  Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM", "  Microsoft network client and server: Digitally sign communications (always) = Enabled", "  Shutdown: Allow system to be shut down without having to log on = Disabled", "  User Account Control: Run all administrators in Admin Approval Mode = Enabled"], "why": "These are the classic CIS and STIG level-one settings; each blocks a named attack: blank-password remote logon, username harvesting, LM and NTLMv1 cracking or relay, SMB relay, pre-auth shutdown, and UAC bypass. Check the level on older releases and mixed domains; Windows 11 24H2 and Windows Server 2025 remove NTLMv1.", "note": "Command-line equivalents live in the registry (Hunter A-02) or secedit (Hunter A-01). With Do not require CTRL+ALT+DEL Disabled, a VM takes the sequence from its window menu or shortcut (Ctrl+Alt+End in Hyper-V and Remote Desktop).", "area": "config"}, {"id": "I-03", "title": "UAC to Always notify", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorAdmin -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name PromptOnSecureDesktop -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name FilterAdministratorToken -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorUser -Value 0 -Type DWord"], "gui": "Control Panel, User Accounts, Change User Account Control settings, slider to the top.", "why": "UAC off means every process an admin runs gets full admin rights silently, which malware loves. ConsentPromptBehaviorAdmin 2 (Always notify) prompts on the secure desktop for every elevation; 5, the default, prompts only for programs outside Windows. FilterAdministratorToken 1 puts the built-in Administrator account under UAC too.", "note": "Changing EnableLUA needs a reboot to fully apply. ConsentPromptBehaviorUser 0 refuses elevation from a standard session, so admins elevate from their own session; keep 3 (ask for credentials) when the brief says helpdesk staff type an admin password at a user's desk. A Security Options policy for these values replaces the slider at the next refresh (gpresult /scope computer /v shows it). When Administrator protection is on (TypeOfAdminApprovalMode 2, Version notes), ConsentPromptBehaviorEnhancedAdmin decides the prompt.", "area": "config"}, {"id": "I-04", "title": "Service audit: what runs, from where", "cmds": ["PS> Get-CimInstance Win32_Service | Select-Object Name,State,StartMode,PathName | Sort-Object Name", "PS> Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName", "PS> Get-Service -Name EventLog,mpssvc,WinDefend | Select-Object Name,Status,StartType", "PS> Get-ItemProperty 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\SNMP\\Parameters\\ValidCommunities' -ErrorAction SilentlyContinue", "PS> Stop-Service -Name <name>; Set-Service -Name <name> -StartupType Disabled"], "why": "Look for Telnet, FTP, SNMP, SSDP and UPnP, Remote Registry, Xbox services, odd names, and any service whose PathName is under C:\\Users or C:\\Temp. Those are planted. SNMP answers on 161/udp to anyone who knows a community name, and public or private is a guess away.", "note": "Required services (IIS, DNS, DHCP, OpenSSH, MySQL, Apache) stay running; harden their configs instead. The event log, firewall (mpssvc), and Defender (WinDefend) services read Running and Automatic; Stopped or Disabled on any of them is a finding (WinDefend can sit stopped when the brief names another antivirus). When the brief leaves SNMP out, remove the feature: Remove-WindowsCapability -Online -Name SNMP.Client~~~~0.0.1.0.", "area": "config"}, {"id": "I-05", "title": "Optional features: SMBv1, Telnet client, TFTP, IIS", "cmds": ["PS> Get-WindowsOptionalFeature -Online | Where-Object State -eq Enabled | Select-Object FeatureName", "PS> Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart", "PS> Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "PS> Disable-WindowsOptionalFeature -Online -FeatureName TelnetClient -NoRestart", "PS> Disable-WindowsOptionalFeature -Online -FeatureName SimpleTCP,Printing-Foundation-LPDPrintService -NoRestart", "PS> Disable-WindowsOptionalFeature -Online -FeatureName IIS-FTPServer -NoRestart"], "why": "SMBv1 is EternalBlue and WannaCry. Telnet and TFTP clients are cleartext tools that should not exist on a workstation. Simple TCP/IP services (echo, daytime, chargen) answer anyone and can reflect traffic, and the LPD service takes print jobs on 515.", "note": "Remove IIS and its FTP server only when the brief leaves out a web or FTP server. -NoRestart lets you batch the restart with the others.", "task": "turn SMBv1 off in the SMB server configuration", "t": "Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "area": "config"}, {"id": "I-06", "title": "Shares", "cmds": ["PS> Get-SmbShare", "CMD> net share", "PS> Get-SmbShare | Where-Object { $_.Name -notmatch '^(ADMIN|IPC|PRINT|FAX)\\$$' -and -not ($_.Name -match '^[A-Z]\\$$' -and $_.Path -eq ($_.Name.Substring(0,1) + ':\\')) } | Select-Object Name,Path,Description", "PS> Remove-SmbShare -Name \"badshare\" -Force", "CMD> auditpol /set /subcategory:\"File Share\" /success:enable /failure:enable"], "why": "An unexpected share is a data exfiltration path. Check the ACLs on the shares you must keep. Event 5142 names who added a share once File Share auditing is on.", "note": "ADMIN$, C$, and IPC$ are system defaults; leave them in place. The filter line lists only added shares. A $ at the end of a name hides a share from browsing and keeps it working: judge every $ share beyond ADMIN$, IPC$, PRINT$, FAX$, and a drive letter that points at its own drive root. A share on C:\\Users or a profile folder exposes that user's files.", "task": "list the shares (cmd)", "t": "net share", "ta": ["get-smbshare"], "area": "access"}, {"id": "I-07", "title": "Scheduled tasks", "cmds": ["PS> Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskPath,TaskName,State,Author,@{n='Run';e={($_.Actions | ForEach-Object { \"$($_.Execute) $($_.Arguments)\" }) -join '; '}},@{n='RunAs';e={$_.Principal.UserId}} | Format-Table -AutoSize -Wrap", "PS> (Get-ScheduledTask -TaskName \"<name>\").Actions | Select-Object Execute,Arguments", "PS> Export-ScheduledTask -TaskPath '\\' -TaskName '<name>' | Out-File -FilePath \"$env:USERPROFILE\\Desktop\\<name>.xml\"", "PS> Disable-ScheduledTask -TaskName \"<name>\" -TaskPath \"\\\"", "PS> Unregister-ScheduledTask -TaskName \"<name>\" -Confirm:$false", "CMD> schtasks /query /fo LIST /v", "CMD> auditpol /set /subcategory:\"Other Object Access Events\" /success:enable /failure:enable", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4698} | Format-List TimeCreated,Message"], "why": "Favorite persistence: a task that re-adds a user, re-opens a port, or runs a script from a user folder every five minutes. Event 4698 records each new task with its full XML and the account that created it, once Other Object Access Events auditing is on.", "note": "Tasks under \\Microsoft\\Windows are mostly legit; focus on the root path, and judge each task by the program it runs, since vendor updaters live in the root folder too. Export a task before you remove it: the XML keeps its action, account, and author for the investigation.", "area": "malware"}, {"id": "I-08", "title": "Startup items and Run keys", "cmds": ["PS> Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Get-ItemProperty 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run' -Name \"<evil>\""], "gui": "Task Manager, Startup apps.", "why": "Anything that auto-runs survives a reboot. Attackers hide here with innocent names like Windows Update Helper.", "note": "Also check the RunOnce keys and the shell:startup folders.", "area": "malware"}, {"id": "I-09", "title": "Hosts file", "cmds": ["PS> Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "GUI: notepad as admin, open the hosts file, and delete every non-comment line except localhost and the entries the brief names"], "why": "Malware points update and antivirus domains at 127.0.0.1 or an attacker IP, so Defender and Windows Update silently fail.", "task": "print the hosts file", "t": "Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "ta": ["type c:\\windows\\system32\\drivers\\etc\\hosts", "cat c:\\windows\\system32\\drivers\\etc\\hosts"], "area": "config"}, {"id": "I-10", "title": "Listening ports to process", "cmds": ["CMD> netstat -abno", "PS> Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess,@{n='Path';e={(Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path}} | Sort-Object LocalPort", "PS> Get-NetUDPEndpoint | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort", "PS> Get-Process -Id <pid> | Select-Object Name,Path", "CMD> tasklist /svc"], "why": "A port you cannot explain is a backdoor; nc.exe listeners are the classic. Map port to PID to binary path to the service or task that starts it.", "task": "show listening ports with their executables (cmd)", "t": "netstat -abno", "ta": ["netstat -ano", "netstat -abn"], "area": "config", "note": "PID 4 is System: file sharing (445) and web ports served by HTTP.sys show it, and netsh http show servicestate names the program behind an HTTP.sys port. Find what starts a listener (service, task, or Run key) before you end it, or it returns at the next trigger."}, {"id": "I-11", "title": "Remote Desktop hardening when RDP is required", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -Value 1", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name SecurityLayer -Value 2", "PS> $ts='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services'; if (-not (Test-Path $ts)) { New-Item -Path $ts -Force | Out-Null }", "PS> foreach ($n in 'fDisableCdm','fDisablePNPRedir','fPromptForPassword','fEncryptRPCTraffic') { Set-ItemProperty -Path $ts -Name $n -Value 1 -Type DWord }", "PS> Get-CimInstance -Namespace root\\cimv2\\TerminalServices -ClassName Win32_TSGeneralSetting | Select-Object TerminalName,UserAuthenticationRequired,PolicySourceUserAuthenticationRequired", "CMD> net localgroup \"Remote Desktop Users\"", "PS> Get-LocalGroupMember -SID S-1-5-32-555", "PS> Set-NetFirewallRule -DisplayGroup \"Remote Desktop\" -RemoteAddress <admin subnet>"], "why": "Network Level Authentication forces a login before a session exists, which kills pre-auth exploits, and the TLS security layer (SecurityLayer 2) proves the server is the real one before anyone types a password. Blocking drive and device redirection keeps a session from reading or dropping files on the connecting PC, and prompting at every connection defeats a password saved in an .rdp file. Administrators connect whenever RDP is on, so the Remote Desktop Users group is the list of non-admins the brief names; audit it. Remote Assistance stays off (B-13). Scope the Remote Desktop firewall rule to the admin subnet that the brief names, so only those addresses reach the port.", "area": "access", "note": "The redirector service (UmRdpService) stays at Manual while RDP is in use; the policy values do the blocking. PolicySource 1 in the read-back means Group Policy decides NLA. SecurityLayer 2 uses a self-signed certificate unless the brief supplies one, so the first connection shows a certificate prompt. -SID S-1-5-32-555 names Remote Desktop Users in any display language."}, {"id": "I-12", "title": "Firewall allow-rule review", "cmds": ["PS> Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {$_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow'} | Select-Object DisplayName,Profile | Sort-Object DisplayName", "PS> Get-NetFirewallRule -PolicyStore ActiveStore -Direction Outbound -Action Block -Enabled True | Select-Object DisplayName,Profile", "PS> Remove-NetFirewallRule -DisplayName \"<suspicious rule>\"", "PS> New-NetFirewallRule -Name 'Allow-HTTP-In' -DisplayName 'Allow HTTP (TCP 80) in' -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -RemoteAddress <brief subnet>", "PS> Set-NetFirewallProfile -All -DefaultInboundAction Block -NotifyOnListen True -LogBlocked True"], "why": "Firewall on means nothing if a rule allows the whole internet into 4444/tcp. An outbound block rule aimed at Defender or Windows Update stops protection quietly. A rule for a required port names its port and the subnet the brief gives, so only those addresses reach it.", "area": "config", "note": "ActiveStore lists the rules in force, Group Policy rules included. -Name gives a new rule a stable handle for Remove-NetFirewallRule -Name later."}, {"id": "I-13", "title": "Local Group Policy quick wins", "cmds": ["GUI: gpedit.msc, Computer Configuration, Administrative Templates", "  Windows Components, Windows Update, Manage end user experience: Configure Automatic Updates = Enabled (4)", "  Windows Components, AutoPlay Policies: Turn off AutoPlay = Enabled, All drives", "  Windows Components, Microsoft Defender Antivirus: Turn off Microsoft Defender Antivirus = Disabled", "CMD> reg query HKLM\\SOFTWARE\\Policies /s", "CMD> gpupdate /force"], "why": "Policy beats settings. A policy that turns Defender off re-disables it after you click it on in the GUI. When a setting will not stick, check policy.", "task": "apply group policy changes now", "t": "gpupdate /force", "area": "config", "note": "reg query HKLM\\SOFTWARE\\Policies /s lists every machine policy value at once; a value that is absent means Not Configured. DisableAntiSpyware 1 under Windows Defender is the Turn off Microsoft Defender Antivirus policy."}, {"id": "I-14", "title": "Event Viewer for investigations", "cmds": ["GUI: eventvwr.msc, Windows Logs, Security", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4720} | Format-List TimeCreated,Message", "  4624 logon OK, 4625 logon failed, 4720 user created, 4726 user deleted, 4732 added to local group, 4672 admin logon, 1102 log cleared, 7045 new service (System log), 4697 service installed (Security log, names the installer once A-08 turns it on)"], "why": "Questions like who created the account on 3 October take one filter if you know a handful of event IDs.", "area": "inv"}, {"id": "I-15", "title": "Screen lock and sign-in requirements", "cmds": ["GUI: Settings, Accounts, Sign-in options: If you've been away, when should Windows require you to sign in again = When PC wakes up from sleep", "CMD> powercfg /setacvalueindex SCHEME_CURRENT SUB_NONE CONSOLELOCK 1", "CMD> powercfg /setdcvalueindex SCHEME_CURRENT SUB_NONE CONSOLELOCK 1", "CMD> powercfg /setactive SCHEME_CURRENT", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name SCRNSAVE.EXE -PropertyType String -Value 'C:\\Windows\\System32\\scrnsave.scr' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveActive -PropertyType String -Value '1' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure -PropertyType String -Value '1' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut -PropertyType String -Value '600' -Force", "PS> Get-CimInstance Win32_Desktop | Select-Object Name,ScreenSaverActive,ScreenSaverSecure,ScreenSaverTimeout", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name InactivityTimeoutSecs -Value 600 -Type DWord", "GUI: gpedit.msc, User Configuration, Administrative Templates, Control Panel, Personalization: Enable screen saver, Password protect the screen saver, Screen saver timeout 600"], "why": "An unlocked, unattended desktop is physical access, and physical access is everything. Ten minutes with a password is the usual policy number.", "note": "The Desktop values are text (REG_SZ) and per user (HKCU): Set-ItemProperty on a missing value writes a number (DWORD) instead, so New-ItemProperty -PropertyType String sets each one, and the lock needs a screen saver chosen (SCRNSAVE.EXE). Win32_Desktop reads back each profile. CONSOLELOCK is the command-line form of the sign-in-on-wake setting and works on Home. InactivityTimeoutSecs takes effect after a restart and locks every idle session, whoever signed in.", "area": "config"}, {"id": "I-16", "title": "SmartScreen, reputation-based protection, memory integrity", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Name EnableSmartScreen -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Name ShellSmartScreenLevel -Value Block -Type String", "GUI: Windows Security, App and browser control, Reputation-based protection: everything On", "GUI: Windows Security, Device security, Core isolation: Memory integrity On", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity' -Name Enabled -Value 1 -Type DWord"], "why": "SmartScreen blocks known-bad downloads and installers before Defender ever scans them; ShellSmartScreenLevel Block stops the click-through that Warn allows. Memory integrity (HVCI) stops unsigned kernel drivers, which is the rootkit class.", "note": "The Test-Path guard keeps the other policies in the System key, which New-Item -Force would erase. Memory integrity may be unavailable inside a VM without nested virtualization; the toggle just will not appear.", "area": "malware"}, {"id": "I-17", "title": "Browsers: updated and protected by policy", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Mozilla\\Firefox /s", "CMD> reg query HKCU\\SOFTWARE\\Policies\\Mozilla\\Firefox /s", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge /s", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Google\\Chrome /s", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Google\\Chrome /v SafeBrowsingProtectionLevel /t REG_DWORD /d 1 /f", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Google\\Chrome /v HttpsOnlyMode /t REG_SZ /d force_enabled /f", "GUI: Firefox, Settings, Privacy & Security: Block dangerous and deceptive content On (with dangerous downloads and unwanted software), HTTPS-Only Mode in all windows, Block pop-up windows On, Warn you when websites try to install add-ons On", "GUI: about:policies (Firefox), chrome://policy (Chrome), and edge://policy (Edge) show every policy in force; about:addons, chrome://extensions, and edge://extensions list extensions to compare with the brief"], "why": "Most attacks reach a workstation through the browser. A planted policy value can switch Safe Browsing off or force an extension, and policy wins over the settings page, so read the policy keys first. Safe Browsing blocks known-bad sites and downloads, and HTTPS-Only keeps sign-ins off plain HTTP.", "note": "Update each browser first (B-09). Firefox can also take policy from a policies.json file in the distribution folder of its install folder; about:policies shows which source applies. A site the brief requires on plain HTTP needs an exception before HTTPS-Only: HttpAllowlist in Chrome, Manage Exceptions in Firefox. Current Firefox replaced Do Not Track with Global Privacy Control.", "task": "list Chrome's machine policy values (cmd)", "t": "reg query HKLM\\SOFTWARE\\Policies\\Google\\Chrome /s", "ta": ["reg query hklm\\software\\policies\\google\\chrome"], "area": "malware"}, {"id": "I-18", "title": "Automatic updates: policy keeps them on (NoAutoUpdate 0, no WSUS redirect)", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /v WUServer", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate /t REG_DWORD /d 0 /f", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /v WUServer /f", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v UseWUServer /f", "GUI: gpedit.msc, Computer Configuration, Administrative Templates, Windows Components, Windows Update, Manage end user experience: Configure Automatic Updates Enabled, option 4 (auto download and schedule the install); Manage updates offered from Windows Server Update Service: Specify intranet Microsoft update service location Not Configured", "CMD> gpupdate /force", "PS> (New-Object -ComObject Microsoft.Update.AutoUpdate).Results"], "why": "B-09 starts the service and installs what is pending; this item keeps updates coming. Policy outranks Settings: NoAutoUpdate 1 switches automatic updates off while the service looks healthy, and WUServer with UseWUServer 1 sends every check to a server the brief leaves out, so the machine stops patching from Microsoft. reg query on the two policy keys settles both in seconds.", "note": "A real domain may set WUServer on purpose for its own update server; on a stand-alone lab machine the brief lists no such server, so the entry is a finding. Keep NoAutoUpdate at 0 or absent, then confirm with the AutoUpdate results: LastSearchSuccessDate and LastInstallationSuccessDate should be recent after a check.", "area": "patch", "t": "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate", "ta": ["reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"], "task": "Show whether policy switches automatic updates off"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Baselines from the command line, registry hardening against credential theft, persistence hunting, Defender depth, SMB signing, and version notes. Learn it first: Defense Ladder se7, \"Windows: credentials and the domain attack surface.\"", "items": [{"id": "A-01", "title": "Security policy as a file: secedit", "cmds": ["CMD> secedit /export /cfg C:\\Temp\\secpol.cfg", "  [System Access] MinimumPasswordAge = 1, MaximumPasswordAge = 60, MinimumPasswordLength = 12, PasswordComplexity = 1, PasswordHistorySize = 24, LockoutBadCount = 5, ResetLockoutCount = 30, LockoutDuration = 30, AllowAdministratorLockout = 1, ClearTextPassword = 0, EnableGuestAccount = 0", "CMD> secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg /areas SECURITYPOLICY", "CMD> secedit /analyze /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg"], "why": "One file, every account policy, repeatable and auditable, and the only command-line path to complexity and reversible encryption.", "note": "A typo in the .cfg is silently ignored. Verify with net accounts. Before /configure, keep only the [Unicode], [Version], and [System Access] sections, so the run changes the password and lockout lines and leaves audit policy and registry values as they are. secedit ships on Home too, so this is the command-line route to complexity on every edition.", "task": "export the local security policy to C:\\Temp\\secpol.cfg", "t": "secedit /export /cfg C:\\Temp\\secpol.cfg", "area": "config"}, {"id": "A-02", "title": "LSA and anonymous-access registry hardening", "cmds": ["PS> $lsa='HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa'", "PS> Set-ItemProperty -Path $lsa -Name LimitBlankPasswordUse -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name NoLMHash -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name LmCompatibilityLevel -Value 5 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name ForceGuest -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictRemoteSAM -Value 'O:BAG:BAD:(A;;RC;;;BA)' -Type String", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name allownullsessionfallback -Value 0 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinClientSec -Value 537395200 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinServerSec -Value 537395200 -Type DWord", "PS> Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy"], "why": "RestrictAnonymous stops null-session enumeration; NoLMHash stops storing LM hashes, which crack in seconds; LmCompatibilityLevel 5 refuses NTLMv1 (Windows 11 24H2 and Windows Server 2025 remove it; check the level on older releases and mixed domains). ForceGuest 0 (Classic) keeps local users signing in over the network as themselves; RestrictRemoteSAM limits remote SAM queries to Administrators. NULL session fallback 0 and NTLM minimum session security 537395200 (NTLMv2 session security plus 128-bit encryption) close the last NTLM downgrades. LocalAccountTokenFilterPolicy 1 hands every local administrator a full token over C$ and ADMIN$ from the network, the pass-the-hash road: remove it so remote local admins stay filtered.", "note": "This is the registry form of the Watchman Security Options. A missing LocalAccountTokenFilterPolicy is the good result. MSV1_0 and the System key exist on every install, so Set-ItemProperty writes into them directly.", "area": "config"}, {"id": "A-03", "title": "Credential-theft hardening: LLMNR, NetBIOS, WDigest", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Name EnableMulticast -Value 0 -Type DWord", "PS> Get-CimInstance Win32_NetworkAdapterConfiguration -Filter \"IPEnabled=TRUE\" | Invoke-CimMethod -MethodName SetTcpipNetbios -Arguments @{TcpipNetbiosOptions=2}", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest' -Name UseLogonCredential -Value 0 -Type DWord"], "why": "LLMNR and NBT-NS are what Responder poisons to collect NTLMv2 hashes for cracking or relay. WDigest set to 1 keeps plaintext passwords in LSASS memory for mimikatz.", "area": "config", "note": "The Test-Path guard creates the key only when it is missing, so DNS client policies already in it stay (A-04 explains why)."}, {"id": "A-04", "title": "AutoRun and AutoPlay off everywhere", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer')) { New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoDriveTypeAutoRun -Value 255 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoAutorun -Value 1 -Type DWord", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer /v NoAutoplayfornonVolume /t REG_DWORD /d 1 /f"], "why": "USB-drop attacks. Conficker-era, still a CIS and STIG requirement. NoAutoplayfornonVolume covers phones and cameras, which the drive-type value leaves out.", "area": "malware", "note": "This Explorer key already holds other policies on a stock install. The Test-Path guard creates the key only when it is missing; New-Item -Force on an existing key deletes every value in it. reg add also keeps the values already there."}, {"id": "A-05", "title": "User Rights Assignment", "cmds": ["GUI: secpol.msc, Local Policies, User Rights Assignment", "  Access this computer from the network = Administrators, Authenticated Users (remove Everyone and Guest)", "  Deny log on through Remote Desktop Services = Guest", "  Deny access to this computer from the network = Guest", "  Debug programs = empty, or Administrators only", "  Act as part of the operating system = empty", "  Back up files and directories, Restore files and directories, Take ownership of files or other objects = Administrators", "  Manage auditing and security log = Administrators", "  Change the system time = Administrators, LOCAL SERVICE", "  Allow log on locally = Administrators, Users", "CMD> secedit /export /cfg C:\\Windows\\Temp\\ura.inf /areas USER_RIGHTS", "PS> Select-String -Path C:\\Windows\\Temp\\ura.inf -Pattern 'SeDebugPrivilege|SeTcbPrivilege|SeNetworkLogonRight|SeBackupPrivilege|SeSecurityPrivilege'", "CMD> whoami /priv"], "why": "Debug programs means read LSASS means dump every password. Back up files and directories reads the SAM hive, Restore and Take ownership rewrite any file, and Manage auditing and security log can clear the Security log (event 1102). Rights are privileges that bypass ACLs, and attackers plant extra principals here.", "task": "show the privileges of the current user", "t": "whoami /priv", "area": "access", "note": "The export lists holders as SIDs: *S-1-5-32-544 is Administrators, *S-1-5-32-545 Users, and *S-1-5-11 Authenticated Users; a SID that resolves to an unknown account belongs to a deleted or planted one. To set a right from the command line, put a line such as SeDebugPrivilege = *S-1-5-32-544 (an empty value empties the right) in a [Privilege Rights] template and apply it as in A-01 with /areas USER_RIGHTS; it applies at the holder's next sign-in. LOCAL SERVICE, NETWORK SERVICE, and SERVICE keep their default rights: remove only user and group accounts. Rights changes write events 4704 and 4705."}, {"id": "A-06", "title": "Deep persistence and backdoor hunt", "cmds": ["PS> Get-CimInstance Win32_Process | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Sort-Object Name", "PS> Get-ChildItem C:\\ -Recurse -Include nc.exe,ncat.exe,netcat*,mimikatz*,psexec*,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding", "PS> $PROFILE | Select-Object *; Get-Content $PROFILE.AllUsersAllHosts -ErrorAction SilentlyContinue", "PS> Get-ChildItem -Path C:\\Users,C:\\ProgramData,C:\\Windows\\Temp -Recurse -Force -File -Include *.exe,*.dll,*.scr -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '^C:\\\\Users\\\\(All Users|Default User)\\\\' | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid' | Select-Object Path,Status", "PS> Get-ChildItem 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree' -Recurse | Where-Object { -not $_.GetValue('SD') -and $_.GetValue('Id') } | Select-Object Name", "CMD> wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true", "CMD> autorunsc.exe -accepteula -a * -c -nobanner   (Sysinternals, public)"], "why": "WMI event subscriptions and PowerShell profiles are the persistence spots checklists miss. Autoruns shows every auto-start location at once. A renamed hacking tool keeps its missing or broken signature, and a task whose SD value was deleted vanishes from Get-ScheduledTask and schtasks while it still runs.", "note": "Download Sysinternals tools only from Microsoft (learn.microsoft.com/sysinternals), and only where policy allows third-party tools on the machine. An unsigned program in Users, ProgramData, or Temp is a lead to check against the brief and the publisher, since plenty of legitimate tools ship unsigned. The wevtutil line turns on Task Scheduler history, which starts off.", "area": "malware"}, {"id": "A-07", "title": "NTFS permissions", "cmds": ["CMD> icacls \"C:\\CompanyData\" /save C:\\Windows\\Temp\\acl.txt /t /c", "CMD> icacls \"C:\\CompanyData\"", "CMD> icacls \"C:\\CompanyData\" /inheritance:r /grant:r \"Administrators:(OI)(CI)F\" \"Users:(OI)(CI)RX\" /t", "CMD> icacls \"C:\\CompanyData\" /remove:g Everyone /t", "PS> Get-Acl \"C:\\CompanyData\" | Format-List"], "why": "Everyone with Full control on a share or a Program Files folder means anyone can replace a binary that a service runs as SYSTEM. (OI) object inherit, (CI) container inherit, /t recurse, /inheritance:r stop inheriting.", "task": "show the ACL of C:\\CompanyData (cmd)", "t": "icacls C:\\CompanyData", "ta": ["icacls \"c:\\companydata\"", "get-acl c:\\companydata"], "area": "access", "note": "Save first: icacls C:\\ /restore C:\\Windows\\Temp\\acl.txt puts the saved ACLs back (restore runs from the parent folder). *S-1-1-0 (Everyone) and *S-1-5-11 (Authenticated Users) work in place of the names in any display language, as in /remove:g *S-1-1-0. A folder made at the root of C: inherits Authenticated Users Modify, so read it before you trust it."}, {"id": "A-08", "title": "Fine-grained auditing and PowerShell logging", "cmds": ["CMD> auditpol /set /subcategory:\"Credential Validation\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Logon\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Account Lockout\" /failure:enable", "CMD> auditpol /set /subcategory:\"User Account Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Security Group Management\" /success:enable", "CMD> auditpol /set /subcategory:\"Process Creation\" /success:enable", "CMD> reg add \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\Audit\" /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f", "CMD> auditpol /set /subcategory:\"Security System Extension\" /success:enable", "CMD> auditpol /set /subcategory:\"Audit Policy Change\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Filtering Platform Connection\" /success:disable /failure:disable", "CMD> reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v SCENoApplyLegacyAuditPolicy /t REG_DWORD /d 1 /f", "PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord", "PS> Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational'; Id=4104} -MaxEvents 3 | Format-List TimeCreated,Message", "CMD> auditpol /get /category:*"], "why": "Subcategory settings take precedence over the nine legacy categories once Audit: Force audit policy subcategory settings is Enabled (SCENoApplyLegacyAuditPolicy 1). Credential Validation writes 4776 for every local-account password check, so a guessing run shows beside 4625. The command-line value fills the Process Command Line field of every 4688. Security System Extension writes 4697, which names who installed a service. Script Block Logging (event 4104) records what every PowerShell script actually did, including the attacker's.", "area": "audit", "note": "Run it after I-01: a category-wide command rewrites every subcategory in its category. Account Lockout has Failure events only (the lockout itself, 4740, comes from User Account Management), and Security Group Management has Success events only. Filtering Platform Connection floods the log after a category-wide run; turn it back on when the brief asks for connection auditing. auditpol names drop the Audit prefix that secpol shows, and each subcategory also takes a GUID that works in any display language, such as {0CCE923F-69AE-11D9-BED3-505054503030} for Credential Validation. On a domain, a GPO that defines advanced auditing re-applies its list at each refresh, so set the values there. PowerShell 7 reads its own key, HKLM:\\SOFTWARE\\Policies\\Microsoft\\PowerShellCore\\ScriptBlockLogging, and logs to PowerShellCore/Operational."}, {"id": "A-09", "title": "Defender beyond on: exclusions, PUA, cloud, ASR", "cmds": ["PS> Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "PS> Remove-MpPreference -ExclusionPath \"C:\\evil\"", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Exclusions\" /s", "PS> Get-MpPreference | Select-Object ThreatIDDefaultAction_Ids,ThreatIDDefaultAction_Actions", "PS> Remove-MpPreference -ThreatIDDefaultAction_Ids <id>", "PS> Set-MpPreference -PUAProtection Enabled -MAPSReporting Advanced -SubmitSamplesConsent SendAllSamples", "PS> Add-MpPreference -AttackSurfaceReductionRules_Ids 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 -AttackSurfaceReductionRules_Actions Enabled", "PS> Get-MpThreatDetection | Select-Object DomainUser,ProcessName,InitialDetectionTime", "PS> Set-MpPreference -EnableControlledFolderAccess Enabled -EnableNetworkProtection Enabled"], "why": "Attackers rarely turn Defender off, too obvious. They exclude their folder. PUA protection catches junkware; the LSASS rule blocks the mimikatz class of attacks. Controlled folder access stops ransomware from rewriting Documents; network protection blocks known-bad domains. A ThreatIDDefaultAction of 6 means Allow: Defender lets that one threat run, a hiding place beside exclusions.", "task": "list Defender exclusions", "t": "Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "ta": ["get-mppreference | select exclusionpath,exclusionprocess,exclusionextension", "get-mppreference"], "area": "malware", "note": "An exclusion set by policy returns after Remove-MpPreference: set the policy to Not Configured in gpedit.msc (or delete the value under the policy key) first, then remove the local one."}, {"id": "A-10", "title": "Optional capabilities: OpenSSH Server and friends", "cmds": ["PS> Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "PS> Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Status,StartType", "PS> Remove-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0", "PS> Get-Content C:\\ProgramData\\ssh\\sshd_config"], "why": "Windows 11 ships OpenSSH Server as an installable capability. An attacker (or a careless admin) can switch it on as a second door that the firewall rule for port 22 quietly allows.", "note": "If the brief requires SSH, keep it and harden C:\\ProgramData\\ssh\\sshd_config (PasswordAuthentication, AllowUsers, no empty passwords), then restart the sshd service.", "task": "list installed Windows capabilities", "t": "Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "ta": ["get-windowscapability -online | where state -eq installed"], "area": "config"}, {"id": "A-11", "title": "SMB signing and encryption", "cmds": ["PS> Set-SmbServerConfiguration -RequireSecuritySignature $true -EncryptData $true -Force", "PS> Set-SmbClientConfiguration -RequireSecuritySignature $true -Force", "PS> Set-SmbClientConfiguration -EnableInsecureGuestLogons $false -Force", "PS> Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol,RequireSecuritySignature,EncryptData", "PS> Get-SmbClientConfiguration | Select-Object RequireSecuritySignature,EnableInsecureGuestLogons"], "why": "Required signing kills NTLM relay, the attack that turns one weak host into domain admin.", "area": "config", "note": "Read the current values before assuming: defaults differ by release and edition (see Version notes). RequireSecuritySignature False or EnableInsecureGuestLogons True on a Pro or Enterprise machine is a finding to explain. Home edition accepts insecure guest logons by default, so a fake file server can hand this PC files without any sign-in; set it to False unless the brief names a guest-only NAS."}, {"id": "A-12", "title": "Verify, document, re-check", "cmds": ["CMD> gpresult /r", "CMD> net accounts", "PS> Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled", "PS> Get-LocalGroupMember Administrators", "CMD> netstat -abno"], "why": "A change log of what, when, and why is how you reverse a change that broke something in thirty seconds instead of thirty minutes, and it is exactly how real incident response works.", "task": "show the applied group policy for this computer and user", "t": "gpresult /r"}, {"id": "A-13", "title": "Version notes: Windows 11 26H2", "cmds": ["  This page targets Windows 11 26H2 (the 24H2 core). Several defaults changed in recent releases: read the current value instead of assuming.", "  Account lockout: new installs of 22H2 and later can start with a lockout policy and Allow Administrator account lockout already set (KB5020282 recommends 10 attempts, 10 minutes, and 10 minutes); upgraded machines and machines patched after setup can start at Never, so read net accounts and set the brief's values either way", "  SMB: since 24H2, Pro, Enterprise, and Education require SMB signing in both directions, and Pro blocks insecure guest logons; Home edition leaves signing optional", "  Administrator protection (Windows 11 only): TypeOfAdminApprovalMode 2 gives each elevation a separate, temporary admin token; it starts off, needs a restart, and while it is on, ConsentPromptBehaviorEnhancedAdmin decides the prompt (I-03)", "  Removed since 24H2: Microsoft Defender Application Guard (and its WDAGUtilityAccount), WMIC (use Get-CimInstance), Windows PowerShell 2.0, NTLMv1", "  Home edition: leaves out lusrmgr.msc, secpol.msc, and gpedit.msc; use Settings, net user, or net accounts"], "why": "Every other item on this page is written to hold across releases; what changed lives here, so a normal default is not mistaken for a finding and a changed default is not mistaken for a fix."}, {"id": "A-14", "title": "Windows Installer: AlwaysInstallElevated off", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v EnableUserControl /t REG_DWORD /d 0 /f", "GUI: gpedit.msc, Computer Configuration and User Configuration, Administrative Templates, Windows Components, Windows Installer: Always install with elevated privileges = Disabled"], "why": "When AlwaysInstallElevated is 1 in both HKLM and HKCU, Windows Installer runs any user's .msi as SYSTEM, a one-step privilege escalation that Microsoft strongly discourages. EnableUserControl 0 keeps install options in administrators' hands.", "note": "HKCU covers only the signed-in user: check each profile the brief keeps by signing in as that user, or read HKEY_USERS\\<SID>\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer. reg add creates a missing key and keeps the values already in it.", "task": "show the Windows Installer machine policy values (cmd)", "t": "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "area": "access"}]}], "spot": [{"lvl": 0, "ask": "Output of net accounts. Tap the line that is the finding.", "lines": ["Minimum password length:                 12", "Maximum password age (days):             60", "Lockout threshold:                       Never", "Length of password history maintained:   24"], "finding": 2, "why": "Lockout threshold Never means unlimited password guesses. Set it to 5 with net accounts /lockoutthreshold:5."}, {"lvl": 0, "ask": "Get-NetFirewallProfile output. Tap the finding.", "lines": ["Domain    True", "Private   True", "Public    False", "DefaultInboundAction  Block"], "finding": 2, "why": "The Public profile is off. A common misconfiguration leaves exactly one profile disabled."}, {"lvl": 0, "ask": "Get-LocalUser output. Tap the finding.", "lines": ["alice   True   PasswordRequired: True", "bob     True   PasswordRequired: True", "svc_backup  True   PasswordRequired: False", "Guest   False  PasswordRequired: False"], "finding": 2, "why": "An enabled account with PasswordRequired False is allowed a blank password: set one and require it (net user svc_backup /passwordreq:yes). Guest is disabled, so it is fine for now."}, {"lvl": 0, "ask": "Today is 10/19/2026. Status lines gathered from this PC. Tap the finding.", "lines": ["Get-Service wuauserv:    Running   Automatic", "Newest Get-HotFix:       Security Update   InstalledOn 5/14/2026", "Defender signatures:     10/19/2026", "Firewall, all profiles:  Enabled True"], "finding": 1, "why": "The newest update is five months old: updates stopped even though the service runs. Open Settings, Windows Update: resume updates if they are paused, check for updates, and install them. Defender signatures update on their own schedule, so their date speaks for Defender alone."}, {"lvl": 1, "ask": "netstat -abno output. Tap the finding.", "lines": ["TCP    0.0.0.0:135    LISTENING   [svchost.exe]", "TCP    0.0.0.0:445    LISTENING   System", "TCP    0.0.0.0:4444   LISTENING   [nc.exe]", "TCP    127.0.0.1:5040 LISTENING   [svchost.exe]"], "finding": 2, "why": "A netcat listener on 4444 is a backdoor. Find its PID, its path, and whatever task or Run key starts it."}, {"lvl": 1, "ask": "UAC registry values. The brief requires a prompt on the secure desktop. Tap the finding.", "lines": ["EnableLUA                  : 1", "ConsentPromptBehaviorAdmin : 0", "PromptOnSecureDesktop      : 1", "FilterAdministratorToken   : 1"], "finding": 1, "why": "ConsentPromptBehaviorAdmin 0 lets admins elevate silently. Set 2 (Always notify) or 5, the default; with PromptOnSecureDesktop 1, both prompt on the secure desktop."}, {"lvl": 1, "ask": "Get-Content of the hosts file. The brief names the intranet server at 10.0.0.5. Tap the finding.", "lines": ["127.0.0.1       localhost", "::1             localhost", "127.0.0.1       update.antivirus-vendor.example", "10.0.0.5        intranet.example.com"], "finding": 2, "why": "This line points the antivirus update site at this PC itself, so every update check fails and signatures go stale. Remove it. The intranet line matches the brief, so it stays."}, {"lvl": 2, "ask": "Get-MpPreference output. Tap the finding.", "lines": ["PUAProtection          : 1", "ExclusionPath          : {C:\\Users\\Public\\Libraries}", "DisableRealtimeMonitoring : False", "MAPSReporting          : 2"], "finding": 1, "why": "An exclusion on a Public folder is how malware hides from a running Defender. Remove it with Remove-MpPreference."}, {"lvl": 2, "ask": "Registry values under HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa. Tap the finding.", "lines": ["RestrictAnonymous      : 1", "NoLMHash               : 1", "LmCompatibilityLevel   : 0", "LimitBlankPasswordUse  : 1"], "finding": 2, "why": "LmCompatibilityLevel 0 sends LM and NTLMv1 responses, which crack in minutes. Set it to 5. Check the level on older releases and mixed domains; Windows 11 24H2 and Windows Server 2025 remove NTLMv1."}, {"lvl": 0, "ask": "reg query of the Windows Update policy keys. The brief says this PC updates straight from Microsoft. Tap the finding.", "lines": ["NoAutoUpdate          REG_DWORD    0x0", "AUOptions             REG_DWORD    0x4", "UseWUServer           REG_DWORD    0x1", "ScheduledInstallDay   REG_DWORD    0x0"], "finding": 2, "why": "UseWUServer 1 sends every update check to the WUServer address instead of Microsoft, while the brief says updates come straight from Microsoft, so updates stop while the service runs. Delete UseWUServer and WUServer from the policy keys, then check for updates."}, {"lvl": 1, "ask": "net share output. Tap the finding.", "lines": ["C$        C:\\            Default share", "IPC$                      Remote IPC", "ADMIN$    C:\\Windows     Remote Admin", "tools$    C:\\Users\\Public\\tools"], "finding": 3, "why": "A $ hides a share from browsing and keeps it reachable. tools$ is an added share on a folder every user can write to: record it, then Remove-SmbShare -Name tools$ -Force when the brief leaves it out. The other three are the defaults."}, {"lvl": 1, "ask": "reg query HKLM\\SOFTWARE\\Policies /s, a few lines. Tap the finding.", "lines": ["...\\Windows\\WindowsUpdate\\AU    AUOptions            REG_DWORD    0x4", "...\\Windows Defender            DisableAntiSpyware   REG_DWORD    0x1", "...\\Windows\\WindowsUpdate\\AU    NoAutoUpdate         REG_DWORD    0x0", "...\\Windows\\System             EnableSmartScreen    REG_DWORD    0x1"], "finding": 1, "why": "DisableAntiSpyware 1 is the Turn off Microsoft Defender Antivirus policy, and it re-applies at every refresh. Set that policy to Disabled or Not Configured in gpedit.msc, run gpupdate /force, and confirm with Get-MpComputerStatus."}, {"lvl": 2, "ask": "Get-MpPreference output. Tap the finding.", "lines": ["PUAProtection                  : 1", "ThreatIDDefaultAction_Ids      : {2147519003}", "ThreatIDDefaultAction_Actions  : {6}", "DisableRealtimeMonitoring      : False"], "finding": 2, "why": "Action 6 is Allow: Defender lets that threat ID run untouched. Remove-MpPreference -ThreatIDDefaultAction_Ids 2147519003, check the policy key for the same override, then scan."}], "judge": [{"lvl": 0, "brief": "Authorized administrators: alice. Authorized users: bob, carol.", "action": "Remove bob from the Administrators group.", "answer": "fix", "why": "Bob is a standard user per the brief. Demoting that account is least privilege."}, {"lvl": 0, "brief": "The company depends on this machine's FTP server for client uploads.", "action": "Stop and disable the FTP service because FTP is insecure.", "answer": "breaks", "why": "Required services must stay up. Harden FTP (no anonymous, strong passwords, firewall rule) instead of killing it."}, {"lvl": 0, "brief": "Investigation 1: what is the MD5 hash of C:\\Users\\Public\\secret.mp3?", "action": "Delete every media file on the machine first, then start the investigation questions.", "answer": "check", "why": "Answer the investigation question before you destroy the evidence. Evidence first, fixes second."}, {"lvl": 0, "brief": "You log in as alice. Alice is an authorized administrator.", "action": "Change the password of every user including alice to a strong one.", "answer": "check", "why": "Changing the sign-in account's password is usually fine but can lock you out if it is recorded wrong; the brief decides. Record every password you set."}, {"lvl": 0, "brief": "Nothing in the brief mentions the backup agent installed under C:\\Program Files\\BackupAgent.", "action": "Delete C:\\Program Files\\BackupAgent because it looks like unknown software.", "answer": "check", "why": "Unrecognized software is distinct from unauthorized software. Check the publisher, the service that runs it, and its scheduled tasks, then ask the owner before removing a backup or monitoring agent."}, {"lvl": 1, "brief": "Remote Desktop must remain available for the helpdesk.", "action": "Set fDenyTSConnections to 1.", "answer": "breaks", "why": "That disables RDP. Keep it, require Network Level Authentication, and audit the Remote Desktop Users group instead."}, {"lvl": 1, "brief": "No media files are allowed on company computers.", "action": "Delete C:\\Users\\bob\\Music\\mixtape.mp3 after confirming no investigation question refers to it.", "answer": "fix", "why": "Policy violation plus confirmation that it is not evidence. Note the path in your change log."}, {"lvl": 1, "brief": "The company runs an IIS web server on this host.", "action": "Run Disable-WindowsOptionalFeature for the IIS-WebServer feature to shrink attack surface.", "answer": "breaks", "why": "Required service. Harden IIS (authentication, directory browsing, updates) rather than removing it."}, {"lvl": 2, "brief": "Auditing must be enabled per company policy.", "action": "Run auditpol /clear to start from a clean baseline.", "answer": "breaks", "why": "That removes all auditing. Set categories or subcategories to Success and Failure instead."}, {"lvl": 1, "brief": "The company handles customer PII; nothing is said about screen locks.", "action": "Set a password-protected screen saver with a 10 minute timeout.", "answer": "fix", "why": "Standard policy for any machine that touches PII, and a CIS Benchmark recommendation for Windows desktops."}, {"lvl": 2, "brief": "IT administers this laptop remotely over SSH.", "action": "Run Remove-WindowsCapability for OpenSSH.Server.", "answer": "breaks", "why": "Required service. Keep it, harden sshd_config, and restrict the firewall rule to the admin subnet."}, {"lvl": 1, "brief": "Admins on 10.0.20.0/24 need Remote Desktop to this PC.", "action": "Set the Remote Desktop firewall rule's RemoteAddress to 10.0.20.0/24.", "answer": "fix", "why": "RDP stays available to the admins who need it, and every other address meets the default inbound block."}, {"
